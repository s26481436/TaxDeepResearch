sources:
  tw-moj-law:
    country: TW
    connector: tw_moj_law
    description: "全國法規資料庫 — 稅務相關法律與命令"
    enabled: true
    config:
      law_categories:
        - "G0340001"  # 所得稅法
        - "G0340002"  # 營利事業所得稅查核準則
        - "G0340003"  # 營業稅法
        - "G0340070"  # 稅捐稽徵法
        - "G0340004"  # 遺產及贈與稅法
        - "G0340050"  # 房屋稅條例
        - "G0340060"  # 土地稅法
        - "G0340080"  # 特種貨物及勞務稅條例

  tw-mof-ruling:
    country: TW
    connector: tw_mof_ruling
    description: "財政部解釋函令與令函"
    enabled: true
    config:
      base_url: "https://law-out.mof.gov.tw"

  tw-constitutional:
    country: TW
    connector: tw_constitutional
    description: "司法院釋字與憲判字（稅務相關）"
    enabled: true
    config:
      base_url: "https://cons.judicial.gov.tw"

  cn-chinatax:
    country: CN
    connector: cn_chinatax
    description: "国家税务总局 — 税收法规与规范性文件"
    enabled: true
    config:
      base_url: "https://www.chinatax.gov.cn"
      list_paths:
        - "/chinatax/n810341/n810755/index.html"
        - "/chinatax/n810341/n810765/index.html"
        - "/chinatax/n810341/n810825/index.html"
      keywords:
        - "企业所得税"
        - "增值税"
        - "印花税"
        - "环境保护税"
        - "资源税"
        - "城市维护建设税"
        - "税收征收管理"
        - "制造业"
        - "小微企业"
        - "研发费用"
        - "加计扣除"
        - "留抵退税"
        - "出口退税"

  cn-mof:
    country: CN
    connector: cn_mof
    description: "财政部 — 税政司/条法司政策发布"
    enabled: true
    config:
      base_url: "https://www.mof.gov.cn"
      list_paths:
        - "/gkml/szs/zhengcefabu/index.htm"
        - "/gkml/tfs/index.htm"
      keywords:
        - "企业所得税"
        - "增值税"
        - "印花税"
        - "环境保护税"
        - "资源税"
        - "城市维护建设税"
        - "税收"
        - "制造业"
        - "小微企业"
        - "研发费用"
        - "加计扣除"

  us-federal-register:
    country: US
    connector: us_federal_register
    description: "Federal Register — IRS rules and notices"
    enabled: false
    config:
      base_url: "https://www.federalregister.gov/api/v1"
      agency: "internal-revenue-service"
