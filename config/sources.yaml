sources:
  tw-moj-law:
    country: TW
    connector: tw_moj_law
    description: "全國法規資料庫 — 稅務相關法律與命令（批次 JSON 下載）"
    enabled: true
    config:
      # Validated against live API on 2026-08-11.
      # Law batch (ChLaw.json):
      law_categories:
        - "G0340003"  # 所得稅法（198 條，異動 20251226）
        - "G0340080"  # 加值型及非加值型營業稅法（80 條，異動 20250528）
        - "G0340001"  # 稅捐稽徵法（74 條，異動 20211217）
        - "G0340072"  # 遺產及贈與稅法（73 條，異動 20210120）
        - "G0340096"  # 土地稅法（75 條，異動 20250124）
        - "G0340102"  # 房屋稅條例（26 條，異動 20240103）
        - "G0340128"  # 特種貨物及勞務稅條例（27 條，異動 20150624）
        # Not a tax statute, but 第10條（研發投抵）、第10-1條（智慧機械及5G投抵）、
        # 第23-1～23-3條（新創投資抵減）set 營所稅與綜所稅 credits that a filer
        # must apply, and they change more often than the tax acts do. Verified
        # against law.moj.gov.tw 2026-08-22; 114-05-07 修正之第22、67-3條 await a
        # 行政院 commencement date, so expect provisions here that are not yet
        # in force.
        - "J0040051"  # 產業創新條例（租稅優惠：研發、智慧機械、新創投資抵減）
        # Order batch (ChOrder.json):
        - "G0340051"  # 營利事業所得稅查核準則（143 條，異動 20231211）

  tw-mof-ruling:
    country: TW
    connector: tw_mof_ruling
    description: "財政部解釋函令與令函"
    enabled: true
    config:
      base_url: "https://law-out.mof.gov.tw"

  tw-constitutional:
    country: TW
    connector: tw_constitutional
    description: "司法院釋字與憲判字（稅務相關）"
    enabled: true
    config:
      base_url: "https://cons.judicial.gov.tw"

  cn-chinatax:
    country: CN
    connector: cn_chinatax
    description: "国家税务总局政策法规库 — 母法（法律/行政法规）+ 部门规章 + 规范性文件"
    enabled: true
    config:
      # Documents come from the fgk 政策法规库 JSON search backend at
      # fgk.chinatax.gov.cn (backed by www.chinatax.gov.cn/search5/search/s).
      # Labels 「法律」「行政法规」 cover the 母法 (增值税法, 企业所得税法 etc.);
      # the remaining labels cover 子法 and 公告.  No separate cn-npc source
      # is needed — the NPC database (flk.npc.gov.cn) is defunct.
      #
      # fgk 分類頁面參考：
      #   法律法規（母法）  /zcfgk/c100009/listflfg_fg.html
      #   行政法規          /zcfgk/c100010/listflfg_fg.html
      #   國務院文件        /zcfgk/c102440/listflfg.html
      #   稅務部門規章      /zcfgk/c100011/list_guizhang.html
      #   財稅文件          /zcfgk/c102416/listflfg.html
      #   稅務規範性文件    /zcfgk/c100012/listflfg.html
      #   其他文件          /zcfgk/c100013/listflfg.html
      #   工作通知          /zcfgk/c102424/listflfg.html
      columns: "政策法规,政策解读,政策指引"
      labels: "法律,行政法规,国务院文件,税务部门规章,税务规范性文件,财税文件"
      max_pages: 10
    # tax_keys:              # 長期只跑特定稅種（CLI --tax 優先）
    #   - vat                # 見 `taxwatch tax-types` 列出所有合法 key
    #   - enterprise_income

  cn-mof:
    country: CN
    connector: cn_mof
    description: "财政部 — 税政司政策发布（szs.mof.gov.cn，税务相关公告）"
    enabled: true
    config:
      base_url: "https://www.mof.gov.cn"
      list_paths:
        - "/zhengwuxinxi/zhengcefabu/"  # 财政部政策发布列表（含税政司文件）
      keywords:
        - "企业所得税"
        - "增值税"
        - "印花税"
        - "环境保护税"
        - "资源税"
        - "城市维护建设税"
        - "税收"
        - "制造业"
        - "小微企业"
        - "研发费用"
        - "加计扣除"

  us-federal-register:
    country: US
    connector: us_federal_register
    description: "Federal Register — IRS proposed rules, final rules, and notices"
    enabled: true
    config:
      base_url: "https://www.federalregister.gov/api/v1"
      agency: "internal-revenue-service"

  us-ecfr:
    country: US
    connector: us_ecfr
    description: "eCFR Title 26 — real-time federal tax regulation amendments (no API key)"
    enabled: true
    config:
      # CFR Title 26 parts to track (no API key required)
      parts:
        - "1"    # Income Taxes (Subchapter A) — the largest part
        - "20"   # Estate Tax (Subchapter B)
        - "25"   # Gift Tax
        - "31"   # Employment Taxes and Collection at Source
        - "301"  # Procedure and Administration
        - "302"  # Taxes Under the International Revenue Code of 1954

  us-govinfo-cfr:
    country: US
    connector: us_govinfo_cfr
    description: "govinfo.gov CFR Title 26 annual bulk XML — year-over-year snapshot"
    enabled: true
    config:
      year: "2025"       # Annual edition year (update each January)
      cfr_title: "26"    # Title 26 = Internal Revenue (22 volumes)

  us-state-tax:
    country: US
    connector: us_state_tax
    description: "US state tax statutes — CA/TX/FL/WA/NY/IL (HTML scraping)"
    enabled: true
    config:
      states:
        - CA   # Revenue and Taxation Code (income, corporate, sales)
        - TX   # Texas Tax Code (franchise, sales; no state income tax)
        - FL   # Florida Statutes (corporate income, sales, estate)
        - WA   # WAC Title 458 (sales/B&O, no income tax)
        - NY   # NY Tax Law (income, corporate, sales, estate)
        - IL   # Illinois Revenue statutes (income, sales)
      # ny_api_key: ""  # Optional: NYSenate API key for structured data
