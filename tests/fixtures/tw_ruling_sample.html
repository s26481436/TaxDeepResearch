<h2>台財稅字第10904512340號</h2>
<div class="content">
<p>主旨：關於所得稅法第14條第1項第5類租賃所得之計算疑義。</p>
<p>說明：依據所得稅法第14條第1項第5類規定，個人出租財產所取得之租金收入，應以全年租賃收入減除必要損耗及費用後之餘額為所得額。</p>
<p>理由：查所得稅法第14條第1項第5類明定租賃所得之計算方式，釋字第745號亦闡明租賃所得應扣除必要費用之意旨。本案納稅義務人依台財稅字第10804012340號函釋計算其租賃所得，惟該函釋業經停止適用，應依現行規定辦理。</p>
</div>
</body>
</html>
