[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxwatch"
version = "0.1.0"
description = "Automated tax law change detection system"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "lxml>=5.1,<6",
    "openai>=1.30,<2",
    "jinja2>=3.1,<4",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "pyyaml>=6.0,<7",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
taxwatch = "taxwatch.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
