services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taxwatch
      POSTGRES_USER: taxwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxwatch_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxwatch"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
